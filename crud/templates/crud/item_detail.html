{% extends 'crud/base.html' %}
{% block title %}{{ item.name }}{% endblock %}
{% block content %}
<h2>{{ item.name }}</h2>
<p>{{ item.description|default:"Без описания" }}</p>
<p>Цена: {{ item.price }}</p>
<p>Количество: {{ item.quantity }}</p>
<p>Создано: {{ item.created_at }}</p>
<a href="{% url 'crud:item_update' item.pk %}">Изменить</a> |
<a href="{% url 'crud:item_delete' item.pk %}">Удалить</a> |
<a href="{% url 'crud:item_list' %}">Назад</a>
{% endblock %}
