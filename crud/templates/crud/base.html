<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CRUD{% endblock %}</title>
    <style>
        body { font-family: "Times New Roman", serif; max-width: 800px; margin: 30px auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #000; padding: 6px; text-align: left; }
        .msg { border: 1px solid #000; padding: 6px; margin-bottom: 10px; }
        .errorlist { color: #b00; }
    </style>
</head>
<body>
    <h1><a href="{% url 'crud:item_list' %}">CRUD</a></h1>
    {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
</body>
</html>
